name: ranqizao

# 宝塔会直接解析本文件，不会自动读取 Compose 默认的 .env。
# 创建编排前，只修改本区域中的源码路径和生产配置文件路径。
x-deploy-config:
  backend-context: &backend-context /www/wwwroot/ranqizao/iot-platform-backend-dev
  ops-web-context: &ops-web-context /www/wwwroot/ranqizao/iot-ops-web-dev
  production-env: &production-env /www/wwwroot/ranqizao/iot-platform-backend-dev/.env.production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - *production-env
    environment:
      TZ: Asia/Shanghai
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$$PGUSER" ] || [ -z "$$PGPASSWORD" ] || [ -z "$$PGDATABASE" ]; then
          echo "部署配置错误：.env.production 缺少 PGUSER、PGPASSWORD 或 PGDATABASE"
          exit 1
        fi
        export POSTGRES_USER="$$PGUSER"
        export POSTGRES_PASSWORD="$$PGPASSWORD"
        export POSTGRES_DB="$$PGDATABASE"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - ranqizao-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$PGUSER" -d "$$PGDATABASE"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  iot-backend:
    build:
      context: *backend-context
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - *production-env
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "3001"
      PGHOST: postgres
      PGPORT: "5432"
      PGADMIN_DATABASE: postgres
    command:
      - /bin/sh
      - -ec
      - |
        for variable_name in \
          PGUSER PGPASSWORD PGDATABASE \
          CORS_ORIGINS JWT_SECRET OPS_JWT_SECRET \
          OPS_ADMIN_USERNAME OPS_ADMIN_PASSWORD; do
          variable_value="$$(printenv "$$variable_name" || true)"
          if [ -z "$$variable_value" ]; then
            echo "部署配置错误：.env.production 缺少 $$variable_name"
            exit 1
          fi
        done
        exec npm run start:docker
    ports:
      - 127.0.0.1:3001:3001
    networks:
      - ranqizao-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:3001/api/health >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

  iot-ops-web:
    build:
      context: *ops-web-context
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      iot-backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:8080:80
    networks:
      - ranqizao-network
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging
    security_opt:
      - no-new-privileges:true

networks:
  ranqizao-network:
    name: ranqizao_network
    driver: bridge

volumes:
  postgres-data:
    name: ranqizao_postgres-data
